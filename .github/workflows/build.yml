
name: Build SwipeClean APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SwipeClean_AndroidStudio.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip SwipeClean_AndroidStudio.zip

      - name: Build APK
        working-directory: SwipeClean
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-debug-apk
          path: SwipeClean/app/build/outputs/apk/debug/app-debug.apk
